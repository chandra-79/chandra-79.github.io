<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Word search</title><style>.k{transform-box:fill-box;transform-origin:center}.fl,.pu,.tw,.sl,.lk,.fp,.pr,.bl,.wv,.wb,.gr{transform-box:fill-box;transform-origin:center;animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.fl{animation-name:fl}.pu{animation-name:pu;animation-duration:2.6s}.tw{animation-name:tw;animation-duration:3s}.sl{animation-name:sl;animation-duration:3.4s}.lk{animation-name:lk;animation-duration:3.6s}.fp{animation-name:fp;animation-duration:5s}.pr{animation-name:pr;animation-duration:2.8s}.bl{animation-name:bl;animation-duration:4.6s}.wv{animation-name:wv;animation-duration:2.4s;transform-origin:0 50%}.wb{animation-name:wb;animation-duration:5s}.gr{animation-name:gr;animation-duration:3.6s;transform-origin:50% 100%}@keyframes fl{50%{transform:translateY(-2.5px)}}@keyframes pu{50%{opacity:.55}}@keyframes tw{50%{transform:scale(1.22) rotate(14deg);opacity:.8}}@keyframes sl{40%,60%{transform:translate(4px,-4px)}}@keyframes lk{35%,65%{transform:translateY(-5px)}}@keyframes fp{40%{transform:scaleX(1)}50%{transform:scaleX(.08)}60%{transform:scaleX(1)}}@keyframes pr{40%,55%{transform:translateY(2.5px)}}@keyframes bl{90%{transform:scaleY(1)}94%{transform:scaleY(.1)}98%{transform:scaleY(1)}}@keyframes wv{50%{transform:skewY(7deg)}}@keyframes wb{25%{transform:rotate(9deg)}75%{transform:rotate(-9deg)}}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.84)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="b-search" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a988c"/><stop offset="1" stop-color="#1a7569"/></linearGradient><clipPath id="c-search"><rect width="128" height="128" rx="34"/></clipPath></defs><rect width="128" height="128" rx="34" fill="url(#b-search)"/><g clip-path="url(#c-search)"><ellipse cx="64" cy="-6" rx="84" ry="44" fill="#fff" fill-opacity=".07"/></g><g class="pu"><rect x="18.5" y="44" width="73" height="22" rx="11" fill="#d8f36a" transform="rotate(45 55 55)"/></g><circle cx="37" cy="37" r="5.5" fill="#28223d"/><circle cx="55" cy="37" r="5.5" fill="#fff8ed"/><circle cx="73" cy="37" r="5.5" fill="#fff8ed"/><circle cx="91" cy="37" r="5.5" fill="#fff8ed"/><circle cx="37" cy="55" r="5.5" fill="#fff8ed"/><circle cx="55" cy="55" r="5.5" fill="#28223d"/><circle cx="73" cy="55" r="5.5" fill="#fff8ed"/><circle cx="91" cy="55" r="5.5" fill="#fff8ed"/><circle cx="37" cy="73" r="5.5" fill="#fff8ed"/><circle cx="55" cy="73" r="5.5" fill="#fff8ed"/><circle cx="73" cy="73" r="5.5" fill="#28223d"/><circle cx="91" cy="73" r="5.5" fill="#fff8ed"/><circle cx="37" cy="91" r="5.5" fill="#fff8ed"/><circle cx="55" cy="91" r="5.5" fill="#fff8ed"/><circle cx="73" cy="91" r="5.5" fill="#fff8ed"/><circle cx="91" cy="91" r="5.5" fill="#fff8ed"/><rect x=".75" y=".75" width="126.5" height="126.5" rx="33.3" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/></svg>
