<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Word Builder</title><style>.k{transform-box:fill-box;transform-origin:center}.fl,.pu,.tw,.sl,.lk,.fp,.pr,.bl,.wv,.wb,.gr{transform-box:fill-box;transform-origin:center;animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.fl{animation-name:fl}.pu{animation-name:pu;animation-duration:2.6s}.tw{animation-name:tw;animation-duration:3s}.sl{animation-name:sl;animation-duration:3.4s}.lk{animation-name:lk;animation-duration:3.6s}.fp{animation-name:fp;animation-duration:5s}.pr{animation-name:pr;animation-duration:2.8s}.bl{animation-name:bl;animation-duration:4.6s}.wv{animation-name:wv;animation-duration:2.4s;transform-origin:0 50%}.wb{animation-name:wb;animation-duration:5s}.gr{animation-name:gr;animation-duration:3.6s;transform-origin:50% 100%}@keyframes fl{50%{transform:translateY(-2.5px)}}@keyframes pu{50%{opacity:.55}}@keyframes tw{50%{transform:scale(1.22) rotate(14deg);opacity:.8}}@keyframes sl{40%,60%{transform:translate(4px,-4px)}}@keyframes lk{35%,65%{transform:translateY(-5px)}}@keyframes fp{40%{transform:scaleX(1)}50%{transform:scaleX(.08)}60%{transform:scaleX(1)}}@keyframes pr{40%,55%{transform:translateY(2.5px)}}@keyframes bl{90%{transform:scaleY(1)}94%{transform:scaleY(.1)}98%{transform:scaleY(1)}}@keyframes wv{50%{transform:skewY(7deg)}}@keyframes wb{25%{transform:rotate(9deg)}75%{transform:rotate(-9deg)}}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.84)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="b-vocab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c15c8a"/><stop offset="1" stop-color="#9d3c68"/></linearGradient><clipPath id="c-vocab"><rect width="128" height="128" rx="34"/></clipPath></defs><rect width="128" height="128" rx="34" fill="url(#b-vocab)"/><g clip-path="url(#c-vocab)"><ellipse cx="64" cy="-6" rx="84" ry="44" fill="#fff" fill-opacity=".07