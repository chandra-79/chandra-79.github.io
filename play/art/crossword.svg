<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Crossword</title><style>.pu,.pp,.wr,.sh{transform-box:fill-box;transform-origin:center;animation:2s cubic-bezier(.34,1.56,.64,1) infinite}.pu{animation-name:pu;animation-duration:2.4s}@keyframes pu{50%{transform:scale(1.12);opacity:.65}}.pp{animation-name:pp;animation-duration:4s;animation-fill-mode:backwards}@keyframes pp{0%{transform:scale(0)}10%{transform:scale(1.35)}17%,86%{transform:scale(1)}94%,100%{transform:scale(0)}}.wr{animation-name:wr;animation-duration:1.6s}@keyframes wr{25%{transform:translate(-3px,2px) rotate(-7deg)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,3px) rotate(5deg)}}.sh{animation-name:sh;animation-duration:6s;animation-timing-function:ease-in-out}@keyframes sh{0%,70%{transform:translateX(0)}100%{transform:translateX(210px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="b-crossword" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#625d82"/><stop offset="1" stop-color="#302b51"/></linearGradient><clipPath id="c-crossword"><rect width="128" height="128" rx="34"/></clipPath><linearGradient id="p-crossword" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f4e4cd"/></linearGradient><filter id="s-crossword" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#140c28" flood-opacity=".32"/></filter></defs><rect width="128" height="128" rx="34" fill="url(#b-crossword)"/><g clip-path="url(#c-crossword)"><ellipse cx="64" cy="-6" rx="84" ry="44" fill="#fff" fill-opacity=".1"/><circle cx="64" cy="70" r="50" fill="#fff" fill-opacity=".08"/><g opacity=".35"><path d="M15 100L16.44 102.56L19 104L16.44 105.44L15 108L13.56 105.44L11 104L13.56 102.56Z" fill="#fff" stroke="#fff" stroke-width="3"/></g><g opacity=".35"><path d="M113 107.5L114.26 109.74L116